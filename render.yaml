# Render Blueprint — public demo: backend and frontend only.
#
# Render reads this file automatically when you create a Blueprint from the
# repo. Values marked `sync: false` are NOT stored here; Render prompts for them
# at deploy time, which is how the API key stays out of Git.
#
# SMS is explicit manual opt-in AFTER webhook and scheduler authentication has
# been implemented and verified. See docs/API_ACCESS.md. Never provision the
# service token for this public-only deployment.

services:
  # ----------------------------------------------------------------- backend
  - type: web
    name: annadata-backend
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    rootDir: AnnaData-Backend-main
    buildCommand: pip install -r requirements.txt
    # Limits are process-local. Keep one worker AND one instance; see docs/API_ACCESS.md.
    # Proxy headers stay disabled until the ingress trust boundary is configured.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Farmer queries and answers are frequently Devanagari/Gurmukhi.
      - key: PYTHONIOENCODING
        value: "utf-8"
      # Required for public chat. Render will prompt for it.
      - key: GEMINI_API_KEY
        sync: false
      # API_SERVICE_TOKEN is intentionally unset: privileged requests fail closed.
      - key: API_RATE_WINDOW_SECONDS
        value: "60"
      - key: API_RATE_PER_CLIENT
        value: "12"
      - key: API_RATE_GLOBAL
        value: "120"
      - key: API_RATE_MAX_CLIENTS
        value: "2048"
      - key: API_MAX_CONCURRENT_REQUESTS
        value: "4"
      - key: API_BODY_READ_TIMEOUT_SECONDS
        value: "15"
      - key: API_MAX_REQUEST_BYTES
        value: "65536"
      - key: API_MAX_UPLOAD_BYTES
        value: "5242880"
      - key: API_MAX_MEDIA_REQUEST_BYTES
        value: "11534336"
      # Fastest model first; later entries are fallbacks on 429/503/404.
      - key: TEXT_MODELS
        value: gemini-3.1-flash-lite,gemini-3.6-flash,gemini-3.5-flash-lite
      - key: MEDIA_MODEL
        value: gemini-3.5-flash-lite
      # Set to the frontend's Render URL after the first deploy, so CORS allows it.
      - key: FRONTEND_URL
        sync: false
      # Optional integrations — leave blank to disable; /health reports status.
      # Postgres for farmer profiles and conversation memory (Neon).
      - key: DATABASE_URL
        sync: false
      - key: GOV_API_KEY
        sync: false
      - key: LOCATION_API_KEY
        sync: false
      - key: EE_SERVICE_KEY
        sync: false
      - key: KNOWLEDGE_BASE_ID
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false

  # ----------------------------------------------------------------- frontend
  - type: web
    name: annadata-frontend
    runtime: static
    rootDir: AnnaData-Frontend-main
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      # Set by hand to the backend's PUBLIC URL after the first deploy, then
      # redeploy this service - Create React App inlines env vars at BUILD
      # time, so a restart alone will not pick up a change.
      #
      #   REACT_APP_API_URL = https://<backend-host>.onrender.com
      #
      # Not `fromService`: that gives the internal hostname, which a browser
      # cannot resolve.
      - key: REACT_APP_API_URL
        sync: false
    routes:
      # Single-page app: serve index.html for any unmatched path.
      - type: rewrite
        source: /*
        destination: /index.html
